# Installed as a systemd drop-in for grafana-server. Localhost only; tailscale serve fronts it.
# (Not /etc/default/grafana-server: that file holds the package's data and log paths.)
[Service]
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_SERVER_ROOT_URL=https://grafana.tail9a7b40.ts.net/
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
